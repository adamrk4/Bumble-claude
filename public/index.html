<!DOCTYPE html>
<html lang="he" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumble AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="/" class="logo">🐝 Bumble AI</a>
  <div class="nav-links">
    <a href="/bulk">Bulk</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page">
  <div id="loading" class="state-msg">
    <div class="spinner"></div>
    Loading matches...
  </div>
  <div id="no-token" class="state-msg" style="display:none">
    <p style="font-size:40px;margin-bottom:12px">🔑</p>
    <p style="margin-bottom:16px;color:var(--text)">Set up your Bumble token to get started.</p>
    <a href="/setup" class="btn btn-primary">Set Up Token</a>
  </div>
  <div id="empty" class="state-msg" style="display:none">
    No matches yet.
  </div>
  <div id="matches-list"></div>
  <div id="last-updated" style="text-align:center;font-size:12px;color:var(--muted);padding:8px"></div>
</div>

<script>
let polling = null;

async function load(silent = false) {
  if (!silent) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('matches-list').innerHTML = '';
  }

  // Check token
  const sess = await fetch('/api/session').then(r => r.json());
  if (!sess.configured) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('no-token').style.display = 'block';
    return;
  }

  const res = await fetch('/api/matches');
  document.getElementById('loading').style.display = 'none';

  if (!res.ok) {
    const err = await res.json();
    if (err.error === 'TOKEN_EXPIRED' || err.error === 'NO_TOKEN') {
      document.getElementById('no-token').style.display = 'block';
    } else {
      document.getElementById('empty').textContent = 'Error: ' + err.message;
      document.getElementById('empty').style.display = 'block';
    }
    return;
  }

  const matches = await res.json();

  if (!matches.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const list = document.getElementById('matches-list');
  list.innerHTML = '';

  matches.forEach(m => {
    const avatarHtml = m.thumbnail
      ? `<img src="${m.thumbnail}" class="match-avatar" alt="" onerror="this.style.display='none'">`
      : `<div class="match-avatar-placeholder">👤</div>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <a href="/chat?id=${m.id}&matchId=${m.matchId}" class="match-item">
        ${avatarHtml}
        <div class="match-info">
          <div class="match-name">${escHtml(m.name)}${m.isUnread ? ' <span class="badge">New</span>' : ''}</div>
          <div class="match-preview">${escHtml(m.lastMessage || 'No messages yet')}</div>
        </div>
        <div style="color:var(--yellow);font-size:18px">›</div>
      </a>
    `;
    list.appendChild(card);
  });

  const now = new Date().toLocaleTimeString('he-IL');
  document.getElementById('last-updated').textContent = `Updated at ${now} · auto-refreshes every 15s`;

  // Start polling if not already running
  if (!polling) {
    polling = setInterval(() => load(true), 15000);
  }
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
